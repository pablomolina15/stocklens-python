# Railway build config — forces Python 3.11 and correct pip behaviour
[phases.setup]
nixPkgs = ["python311", "gcc", "libffi"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install -r requirements.txt --no-cache-dir"
]

[start]
cmd = "gunicorn main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120 --log-level info"
